<div class="app-container">
  <nav class="sidebar">
    <div class="logo">
      <h1>Git Analyzer</h1>
    </div>
    <ul class="nav-menu">
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
  <main class="main-content">
    <router-outlet />
  </main>
</div>
